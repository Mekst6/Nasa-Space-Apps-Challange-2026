<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Lunar Landing Site Navigator</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='14' fill='%23bbb'/%3E%3Cpath d='M16 2a14 14 0 0 1 0 28z' fill='%23555'/%3E%3C/svg%3E" />
    <link rel="stylesheet" href="./src/style.css" />
  </head>
  <body>
    <header class="topbar">
      <h1>Lunar Landing Site Navigator</h1>
      <span class="subtitle">NASA Space Apps Challenge 2026</span>
      <button type="button" id="ranking-open" class="topbar-btn">Best sites ★</button>
      <button type="button" id="compare-open" class="topbar-btn">Compare sites ⇄</button>
      <button type="button" id="share" class="topbar-btn" title="Copy a link to this site, time and view"><span class="share-label">Share </span>🔗</button>
    </header>
    <main id="viewport"></main>
    <aside id="sidebar" class="sidebar" aria-label="Sites and metrics"></aside>
    <div id="labels"></div>
    <section id="compare" class="compare" aria-label="Compare two sites"></section>
    <section id="ranking" class="compare ranking" aria-label="Ranking of all sites"></section>
    <section id="terrain" class="terrain" aria-label="3D terrain view"></section>
    <footer id="timeline" class="timeline"></footer>
    <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
    <script type="module" src="./src/main.js"></script>
  </body>
</html>
